name: TWRP 14.1 Builder

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: 'Custom Recovery Tree URL (leave blank to skip cloning)'
        required: true
        default: ''
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: ''
      DEVICE_PATH:
        description: 'Device Path (e.g. device/vendor/codename)'
        required: true
        default: ''
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: ''
      BUILD_TARGET:
        description: 'Build Target (vendorboot only)'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check (blank to skip)'
        required: false
        default: ''
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true
      CUSTOM_MAKEFILE_URL:
        description: 'Optional: raw URL of a custom build/make/core/Makefile (leave blank for stock)'
        required: false
        default: ''

jobs:
  build:
    name: Build TWRP 14.1 by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
      MANIFEST_BRANCH: omni-14.1
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v3

    - name: Validate Inputs
      run: |
        for var in DEVICE_TREE DEVICE_TREE_BRANCH DEVICE_PATH DEVICE_NAME; do
          val="${{ github.event.inputs[env[var]] }}"
          if [ -z "$val" ]; then
            echo "::error::Input '$var' is required but was left blank."
            exit 1
          fi
        done

    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL:    $MANIFEST_URL"
        echo "Manifest Branch: $MANIFEST_BRANCH"
        echo "Device Tree:     ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch:   ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path:     ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name:     ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target:    ${{ github.event.inputs.BUILD_TARGET }}image"
        echo "Custom Makefile: ${{ github.event.inputs.CUSTOM_MAKEFILE_URL }}"
        echo "::endgroup::"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Increase vm.swappiness
      run: |
        sudo sysctl vm.swappiness=120
        echo "vm.swappiness is now: $(cat /proc/sys/vm/swappiness)"

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install OpenJDK 17
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 17

    - name: Verify Java version
      run: java -version

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize Repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "TWRP Builder"
        git config --global user.email "builder@example.com"
        repo init --depth=1 -u $MANIFEST_URL -b $MANIFEST_BRANCH

    - name: Repo Sync
      run: |
        cd workspace
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Apply Custom Makefile (optional)
      if: github.event.inputs.CUSTOM_MAKEFILE_URL != ''
      run: |
        echo "::group::Applying custom Makefile"
        echo "URL: ${{ github.event.inputs.CUSTOM_MAKEFILE_URL }}"
        cd workspace
        wget -q -O build/make/core/Makefile "${{ github.event.inputs.CUSTOM_MAKEFILE_URL }}"
        if [ ! -s build/make/core/Makefile ]; then
          echo "::error::Custom Makefile download failed or is empty. Aborting."
          exit 1
        fi
        echo "--- First 5 lines of new Makefile ---"
        head -n 5 build/make/core/Makefile
        echo "--- SHA256 ---"
        sha256sum build/make/core/Makefile
        echo "::endgroup::"

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} \
          -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
          ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Build Makefile
      run: |
        cd workspace
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME }}.mk ]; then
          echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME }}.mk ]; then
          echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
          echo "::error::No recovery makefile found!"
          exit 1
        fi
      continue-on-error: false

    - name: Building Image
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export SOONG_ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        lunch ${{ env.DEVICE_MAKEFILE }}-ap2a-eng
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building your ${{ github.event.inputs.BUILD_TARGET }}.img"

    - name: Set Build Date & Device Tree URL
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Image Exists
      run: |
        cd workspace
        TARGET_IMG="out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img"
        if [ -f "${TARGET_IMG}" ]; then
          echo "RECOVERY_TYPE=$(basename "${TARGET_IMG}" .img)" >> $GITHUB_ENV
          echo "MD5_IMG=$(md5sum "${TARGET_IMG}" | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "Found: ${TARGET_IMG}"
        else
          echo "::error::No ${TARGET_IMG} found!"
          exit 1
        fi

    - name: Include Recovery Installer
      if: github.event.inputs.RECOVERY_INSTALLER == 'true'
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
        wget https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
        zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
      continue-on-error: true

    - name: Recovery to tar for Samsung devices
      if: github.event.inputs.RECOVERY_TAR == 'true'
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
        tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
      continue-on-error: true

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.tar
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery-installer.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.img
        name: Unofficial TWRP 14.1 for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: omni-14.1
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}

    - name: Checking For Missing Dependencies
      if: github.event.inputs.LDCHECK != ''
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/ 2>/dev/null || true
        mv -n ldcheck ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/ 2>/dev/null || true
        cd ../workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }}
        echo "Done checking missing dependencies."
      continue-on-error: true
