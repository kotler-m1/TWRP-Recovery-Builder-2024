name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-14.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree (full git URL)'
        required: true
        default: ''
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: ''
      DEVICE_PATH:
        description: 'Device Path inside workspace (e.g. device/lava/lxx521)'
        required: true
        default: ''
      DEVICE_NAME:
        description: 'Device Codename (e.g. lxx521)'
        required: true
        default: ''
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true
      PATCH_CORE_MAKEFILE:
        description: 'Replace build/make/core/Makefile with the custom version from kotler-m1 (set false to keep stock)'
        required: true
        default: true
        type: boolean
      CUSTOM_MAKEFILE_URL:
        description: 'Raw URL of the custom core Makefile to install (used when PATCH_CORE_MAKEFILE is true)'
        required: false
        default: 'https://raw.githubusercontent.com/kotler-m1/android_device_lava_LXX521-recovery/PE-14/Makefile'

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Validate Inputs
      run: |
        fail=0
        for v in DEVICE_TREE DEVICE_TREE_BRANCH DEVICE_PATH DEVICE_NAME MANIFEST_BRANCH; do
          case "$v" in
            DEVICE_TREE)        val="${{ github.event.inputs.DEVICE_TREE }}" ;;
            DEVICE_TREE_BRANCH) val="${{ github.event.inputs.DEVICE_TREE_BRANCH }}" ;;
            DEVICE_PATH)        val="${{ github.event.inputs.DEVICE_PATH }}" ;;
            DEVICE_NAME)        val="${{ github.event.inputs.DEVICE_NAME }}" ;;
            MANIFEST_BRANCH)    val="${{ github.event.inputs.MANIFEST_BRANCH }}" ;;
          esac
          if [ -z "$val" ]; then
            echo "::error::Input $v is empty."
            fail=1
          fi
        done
        if [ "${{ github.event.inputs.PATCH_CORE_MAKEFILE }}" = "true" ] && \
           [ -z "${{ github.event.inputs.CUSTOM_MAKEFILE_URL }}" ]; then
          echo "::error::PATCH_CORE_MAKEFILE=true requires CUSTOM_MAKEFILE_URL."
          fail=1
        fi
        [ "$fail" -eq 0 ] || exit 1

    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}image"
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "Replace Core Makefile: ${{ github.event.inputs.PATCH_CORE_MAKEFILE }}"
        echo "Custom Makefile URL: ${{ github.event.inputs.CUSTOM_MAKEFILE_URL }}"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v3

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev \
          lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libstdc++-10-dev libtinfo5 libgflags-dev cpio
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "TWRP Builder"
        git config --global user.email "builder@example.com"
        repo init --depth=1 --partial-clone --clone-filter=blob:none \
          -u ${{ steps.manifest.outputs.value }} \
          -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: |
        cd workspace
        repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

   
    # Install custom core Makefile (full replacement).
    
    - name: Install Custom Core Makefile
      if: github.event.inputs.PATCH_CORE_MAKEFILE == 'true'
      run: |
        cd workspace
        MF=build/make/core/Makefile
        if [ ! -f "$MF" ]; then
          echo "::error::$MF not found after repo sync."
          exit 1
        fi

        URL="${{ github.event.inputs.CUSTOM_MAKEFILE_URL }}"
        echo "Downloading custom core Makefile: $URL"

        if ! curl -fsSL "$URL" -o /tmp/custom_Makefile; then
          echo "::error::Failed to download $URL"
          exit 1
        fi
        if [ ! -s /tmp/custom_Makefile ]; then
          echo "::error::Downloaded Makefile is empty."
          exit 1
        fi
        if head -1 /tmp/custom_Makefile | grep -qi '<!DOCTYPE\|<html'; then
          echo "::error::Downloaded file looks like HTML, not a Makefile (bad URL?)."
          exit 1
        fi
        if ! grep -q 'INTERNAL_VENDOR_RAMDISK_TARGET' /tmp/custom_Makefile; then
          echo "::error::Downloaded file does not reference INTERNAL_VENDOR_RAMDISK_TARGET — wrong file."
          exit 1
        fi

        echo "---- diff summary vs stock core/Makefile ----"
        diff -u "$MF" /tmp/custom_Makefile | head -40 || true
        echo "---------------------------------------------"

        cp /tmp/custom_Makefile "$MF"
        echo "Replaced $MF with custom version."

        echo "---- verification ----"
        if grep -q 'ifdef BOARD_PREBUILT_VENDOR_RAMDISK' "$MF"; then
          echo "✅ BOARD_PREBUILT_VENDOR_RAMDISK branch present."
          grep -A4 'ifdef BOARD_PREBUILT_VENDOR_RAMDISK' "$MF" | head -8 || true
        else
          echo "::warning::Custom Makefile does not contain BOARD_PREBUILT_VENDOR_RAMDISK — the small-ramdisk fallback will happen."
        fi

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} \
          -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
          ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Build Makefile
      run: |
        cd workspace
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME }}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME }}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "::error::No recovery makefile (twrp_<codename>.mk / omni_<codename>.mk) in ${{ github.event.inputs.DEVICE_PATH }}"
            exit 1
        fi

    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1' && github.event.inputs.MANIFEST_BRANCH != 'twrp-14.1'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    - name: Building Image
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        rm -rf out
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building your ${{ github.event.inputs.BUILD_TARGET }}.img"

    - name: Verify Vendor Ramdisk Size
      if: github.event.inputs.BUILD_TARGET == 'vendorboot'
      run: |
        cd workspace
        OUT=out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        VBOOT="$OUT/vendor_boot.img"
        if [ ! -f "$VBOOT" ]; then
          echo "::error::vendor_boot.img was not produced."
          exit 1
        fi
        SIZE=$(stat -c%s "$VBOOT")
        echo "vendor_boot.img size: $SIZE bytes ($(numfmt --to=iec $SIZE))"
        if [ "$SIZE" -lt 20000000 ]; then
          echo "::error::vendor_boot.img is only $SIZE bytes — the platform ramdisk is empty/AOSP-generated."
          echo "Check that BOARD_PREBUILT_VENDOR_RAMDISK is set and that core/Makefile actually honours it."
          echo "If you set PATCH_CORE_MAKEFILE=false, verify the manifest branch already supports the variable."
          exit 1
        fi

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Detect Built Image
      run: |
        cd workspace
        OUT=out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        if [ -f "$OUT/recovery.img" ]; then
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
            echo "IMG_FILE=recovery.img" >> $GITHUB_ENV
        elif [ -f "$OUT/boot.img" ]; then
            echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
            echo "IMG_FILE=boot.img" >> $GITHUB_ENV
        elif [ -f "$OUT/vendor_boot.img" ]; then
            echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
            echo "IMG_FILE=vendor_boot.img" >> $GITHUB_ENV
        else
            echo "::error::No recovery image found in $OUT"
            exit 1
        fi
        echo "MD5_IMG=$(md5sum $OUT/$IMG_FILE | cut -d ' ' -f 1)" >> $GITHUB_ENV

    - name: Include Recovery Installer
      if: github.event.inputs.RECOVERY_INSTALLER == 'true'
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
        wget https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
        zip -ur recovery-installer.zip ${{ env.IMG_FILE }}
      continue-on-error: true

    - name: Recovery to tar for Samsung devices
      if: github.event.inputs.RECOVERY_TAR == 'true'
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
        tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.IMG_FILE }}
      continue-on-error: true

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.tar
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery-installer.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.IMG_FILE }}
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Target: ${{ env.IMG_FILE }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}

    - name: Release Ramdisks (debug)
      if: github.event.inputs.BUILD_TARGET == 'vendorboot'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_boot_intermediates/vendor_ramdisk.*
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ramdisk-recovery.*
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
